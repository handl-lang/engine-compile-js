[package]
name = "handl-plugin-compile-js"
version = "0.1.0"
edition = "2024"
description = "JavaScript compiler for the Handl arrow calculus (ADR-0114 Phase 3)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-compile-js"
readme = "README.md"
keywords = ["handl", "javascript", "compiler"]
categories = ["compilers", "development-tools"]
# Git-install only: https://github.com/handl-lang/engine-compile-js (no crates.io).
publish = false

[dependencies]
# ADR-0128 Phase 5: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../host` checkout.
handl-plugin-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-arrow-lower = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-transform-rewrite = { git = "https://github.com/handl-lang/engine-transform-rewrite", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-typecheck = { git = "https://github.com/handl-lang/engine-typecheck", branch = "main" }
serde_json = "1"

[dev-dependencies]
rand = "0.9"
handl-kit-data-prelude = { git = "https://github.com/handl-lang/kit-data-prelude", branch = "main" }

